[Rainmeter]
Update=66
DynamicWindowSize=1
AccurateText=1
MouseActionCursor=1
ContextTitle=Size 75%
ContextAction=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle2=Size 100%
ContextAction2=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle3=Size 125%
ContextAction3=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle4=Size 150%
ContextAction4=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle5=Size 200%
ContextAction5=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Calculator
Author=NThing Widgets
Information=Opens the Windows calculator. The keys light up one after another.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

; 90 frames = one loop
[MeasureP]
Measure=Calc
Formula=([MeasureP]+1)%90

[Tile]
Meter=Shape
Shape=Rectangle 0,0,(260*#U#),(260*#U#),(52*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#
Shape2=Ellipse (86*#U#),(84*#U#),(36*#U#) | Fill Color #Key# | StrokeWidth 1.5 | Stroke Color #KeyEdge#
Shape3=Ellipse (174*#U#),(84*#U#),(36*#U#) | Fill Color #Key# | StrokeWidth 1.5 | Stroke Color #KeyEdge#
Shape4=Ellipse (86*#U#),(168*#U#),(36*#U#) | Fill Color #Key# | StrokeWidth 1.5 | Stroke Color #KeyEdge#
Shape5=Ellipse (174*#U#),(168*#U#),(36*#U#) | Fill Color #Accent# | StrokeWidth 0
LeftMouseUpAction=["calc.exe"]

; light-up overlays (shown one at a time)
[Flash1]
Meter=Shape
DynamicVariables=1
Hidden=([MeasureP]<12 ? 0 : 1)
Shape=Ellipse (86*#U#),(84*#U#),(36*#U#) | Fill Color 48,48,48,255 | StrokeWidth 1.5 | Stroke Color #KeyEdge#
[Flash2]
Meter=Shape
DynamicVariables=1
Hidden=([MeasureP]<22 ? 1 : ([MeasureP]<34 ? 0 : 1))
Shape=Ellipse (174*#U#),(84*#U#),(36*#U#) | Fill Color 48,48,48,255 | StrokeWidth 1.5 | Stroke Color #KeyEdge#
[Flash3]
Meter=Shape
DynamicVariables=1
Hidden=([MeasureP]<45 ? 1 : ([MeasureP]<57 ? 0 : 1))
Shape=Ellipse (86*#U#),(168*#U#),(36*#U#) | Fill Color 48,48,48,255 | StrokeWidth 1.5 | Stroke Color #KeyEdge#
[Flash4]
Meter=Shape
DynamicVariables=1
Hidden=([MeasureP]<67 ? 1 : ([MeasureP]<79 ? 0 : 1))
Shape=Ellipse (174*#U#),(168*#U#),(38*#U#) | Fill Color 255,60,60,255 | StrokeWidth 0

[Glyphs]
Meter=Shape
Shape=Line (74*#U#),(84*#U#),(98*#U#),(84*#U#) | StrokeWidth (4*#U#) | Stroke Color #Fg# | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line (86*#U#),(72*#U#),(86*#U#),(96*#U#) | StrokeWidth (4*#U#) | Stroke Color #Fg# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line (162*#U#),(84*#U#),(186*#U#),(84*#U#) | StrokeWidth (4*#U#) | Stroke Color #Fg# | StrokeStartCap Round | StrokeEndCap Round
Shape4=Line (76*#U#),(158*#U#),(96*#U#),(178*#U#) | StrokeWidth (4*#U#) | Stroke Color #Fg# | StrokeStartCap Round | StrokeEndCap Round
Shape5=Line (96*#U#),(158*#U#),(76*#U#),(178*#U#) | StrokeWidth (4*#U#) | Stroke Color #Fg# | StrokeStartCap Round | StrokeEndCap Round
Shape6=Line (163*#U#),(162*#U#),(185*#U#),(162*#U#) | StrokeWidth (4*#U#) | Stroke Color #Fg# | StrokeStartCap Round | StrokeEndCap Round
Shape7=Line (163*#U#),(174*#U#),(185*#U#),(174*#U#) | StrokeWidth (4*#U#) | Stroke Color #Fg# | StrokeStartCap Round | StrokeEndCap Round
LeftMouseUpAction=["calc.exe"]

[MeterLabel]
Meter=String
StringAlign=CenterCenter
FontFace=#Mono#
FontSize=(8.5*#U#)
FontColor=#Muted#
X=(130*#U#)
Y=(238*#U#)
Text=CALCULATOR
