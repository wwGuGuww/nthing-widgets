[Rainmeter]
Update=66
DynamicWindowSize=1
AccurateText=1
MouseActionCursor=1
ContextTitle=Edit notes
ContextAction=["#@#Notes.txt"]
ContextTitle2=Size 75%
ContextAction2=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle3=Size 100%
ContextAction3=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle4=Size 125%
ContextAction4=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle5=Size 150%
ContextAction5=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle6=Size 200%
ContextAction6=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Notes
Author=NThing Widgets
Information=Shows @Resources\Notes.txt. Click the widget (or use the right-click menu) to edit it.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

; Reads the text file through WebParser (re-read every ~5 s)
[MeasureFile]
Measure=WebParser
URL=file://#@#Notes.txt
RegExp=(?s)^(.*)$
UpdateRate=75
StringIndex=1

; blinking dot: 1 s period
[MeasureTick]
Measure=Calc
Formula=([MeasureTick]+1)%30

[Tile]
Meter=Shape
DynamicVariables=1
Hidden=0
Shape=Rectangle 0,0,(544*#U#),(124*#U#),(44*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#
LeftMouseUpAction=["#@#Notes.txt"]

[Blink]
Meter=Shape
DynamicVariables=1
Hidden=([MeasureTick]<15 ? 0 : 1)
Shape=Ellipse (506*#U#),(30*#U#),(4*#U#) | Fill Color #Accent# | StrokeWidth 0

[MeterLabel]
Meter=String
FontFace=#Mono#
FontSize=(10*#U#)
FontColor=#Muted#
X=(34*#U#)
Y=(22*#U#)
Text=NOTES

[MeterNotes]
Meter=String
MeasureName=MeasureFile
FontFace=#Mono#
FontSize=(11.25*#U#)
FontColor=#Fg#
X=(34*#U#)
Y=(46*#U#)
W=(476*#U#)
H=(60*#U#)
ClipString=2
AntiAlias=1
Text=%1
LeftMouseUpAction=["#@#Notes.txt"]
