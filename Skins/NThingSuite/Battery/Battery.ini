[Rainmeter]
Update=66
DynamicWindowSize=1
AccurateText=1
ContextTitle=Size 75%
ContextAction=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle2=Size 100%
ContextAction2=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle3=Size 125%
ContextAction3=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle4=Size 150%
ContextAction4=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle5=Size 200%
ContextAction5=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Battery
Author=NThing Widgets
Information=Dotted battery ring. The ring fills on load and a bolt blinks while charging.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

[MeasurePct]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT

[MeasureAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

; displayed value eases towards the real value (fill animation)
[MeasureDisp]
Measure=Calc
Formula=[MeasureDisp]+([MeasurePct]-[MeasureDisp])*0.12
DynamicVariables=1

; 0..99.7 -> radians for the arc end point
[MeasureRad]
Measure=Calc
Formula=(([MeasureDisp]>99.7) ? 99.7 : [MeasureDisp])*0.0628319
DynamicVariables=1

[MeasureLarge]
Measure=Calc
Formula=([MeasureDisp]>50) ? 1 : 0
DynamicVariables=1

[MeasureTick]
Measure=Calc
Formula=([MeasureTick]+1)%24
DynamicVariables=1

; a pale dot circles the ring once every 4 s (60 frames)
[MeasureSpin]
Measure=Calc
Formula=([MeasureSpin]+1)%60
DynamicVariables=1
[MeasureSpinRad]
Measure=Calc
Formula=[MeasureSpin]*0.10472
DynamicVariables=1

; number of digits, used to keep "NN%" centred
[MeasureDigits]
Measure=Calc
Formula=([MeasureDisp]>=99.5) ? 3 : (([MeasureDisp]>=9.5) ? 2 : 1)
DynamicVariables=1

[MeasureShowBolt]
Measure=Calc
Formula=[MeasureAC]*(([MeasureTick]<14) ? 1 : 0)
DynamicVariables=1

[Face]
Meter=Shape
Shape=Ellipse (130*#U#),(130*#U#),(129*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#
Shape2=Ellipse (130*#U#),(130*#U#),(108*#U#) | Fill Color 0,0,0,0 | StrokeWidth (6*#U#) | Stroke Color #Dim# | StrokeDashes 0,2.356 | StrokeDashCap Round | Rotate -90

[Fill]
Meter=Shape
DynamicVariables=1
Shape=Arc (130*#U#),(22*#U#),(130*#U#+108*#U#*sin([MeasureRad])),(130*#U#-108*#U#*cos([MeasureRad])),(108*#U#),(108*#U#),0,0,[MeasureLarge] | Fill Color 0,0,0,0 | StrokeWidth (9*#U#) | Stroke Color #Accent# | StrokeDashes 0,1.571 | StrokeDashCap Round

[Shimmer]
Meter=Shape
DynamicVariables=1
Shape=Ellipse (130*#U#+108*#U#*sin([MeasureSpinRad])),(130*#U#-108*#U#*cos([MeasureSpinRad])),(4.5*#U#) | Fill Color 255,255,255,210 | StrokeWidth 0

[Bolt]
Meter=Shape
DynamicVariables=1
Hidden=(1-[MeasureShowBolt])
Shape=Path BoltPath | Fill Color #Accent# | StrokeWidth 0
BoltPath=(133*#U#),(178*#U#) | LineTo (124*#U#),(194*#U#) | LineTo (131*#U#),(194*#U#) | LineTo (129*#U#),(206*#U#) | LineTo (139*#U#),(189*#U#) | LineTo (132*#U#),(189*#U#) | ClosePath 1

[MeterPct]
Meter=String
MeasureName=MeasureDisp
StringAlign=RightCenter
FontFace=#Dot#
FontSize=(46*#U#)
FontColor=#Fg#
NumOfDecimals=0
DynamicVariables=1
X=(114*#U#+18*#U#*[MeasureDigits])
Y=(118*#U#)
AntiAlias=1
Text=%1

; "%" drawn from two rings and a slash so it matches the dot-matrix digits
[MeterUnit]
Meter=Shape
DynamicVariables=1
Shape=Ellipse (131*#U#+18*#U#*[MeasureDigits]-6*#U#),(118*#U#-8*#U#),(4*#U#) | Fill Color 0,0,0,0 | StrokeWidth (2.5*#U#) | Stroke Color #Muted#
Shape2=Ellipse (131*#U#+18*#U#*[MeasureDigits]+6*#U#),(118*#U#+8*#U#),(4*#U#) | Fill Color 0,0,0,0 | StrokeWidth (2.5*#U#) | Stroke Color #Muted#
Shape3=Line (131*#U#+18*#U#*[MeasureDigits]+8*#U#),(118*#U#-12*#U#),(131*#U#+18*#U#*[MeasureDigits]-8*#U#),(118*#U#+12*#U#) | StrokeWidth (2.5*#U#) | Stroke Color #Muted# | StrokeStartCap Round | StrokeEndCap Round

[MeterLabel]
Meter=String
StringAlign=CenterCenter
FontFace=#Mono#
FontSize=(10*#U#)
FontColor=#Muted#
X=(130*#U#)
Y=(172*#U#)
Text=BATTERY
