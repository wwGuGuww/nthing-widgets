[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
ContextTitle=Size 75%
ContextAction=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle2=Size 100%
ContextAction2=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle3=Size 125%
ContextAction3=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle4=Size 150%
ContextAction4=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle5=Size 200%
ContextAction5=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Clock
Author=NThing Widgets
Information=Dot-matrix clock with a travelling seconds dot.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

[MeasureHour]
Measure=Time
Format=%H

[MeasureMin]
Measure=Time
Format=%M

; seconds (0-59) -> angle in radians, plus two trailing dots
[MeasureSec]
Measure=Time
Format=%S

[MeasureAng0]
Measure=Calc
Formula=([MeasureSec]%60)*0.1047198
[MeasureAng1]
Measure=Calc
Formula=(([MeasureSec]+59)%60)*0.1047198
[MeasureAng2]
Measure=Calc
Formula=(([MeasureSec]+58)%60)*0.1047198

[Face]
Meter=Shape
Shape=Ellipse (130*#U#),(130*#U#),(129*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#
Shape2=Ellipse (130*#U#),(130*#U#),(112*#U#) | Fill Color 0,0,0,0 | StrokeWidth (4*#U#) | Stroke Color #Dim# | StrokeDashes 0,2.932 | StrokeDashCap Round | Rotate -90
Shape3=Ellipse (130*#U#),(130*#U#),(112*#U#) | Fill Color 0,0,0,0 | StrokeWidth (6*#U#) | Stroke Color #Fg# | StrokeDashes 0,29.32 | StrokeDashCap Round | Rotate -90

[SecondsDots]
Meter=Shape
DynamicVariables=1
Shape=Ellipse (130*#U#+112*#U#*sin([MeasureAng2])),(130*#U#-112*#U#*cos([MeasureAng2])),(3*#U#) | Fill Color #AccentFaint# | StrokeWidth 0
Shape2=Ellipse (130*#U#+112*#U#*sin([MeasureAng1])),(130*#U#-112*#U#*cos([MeasureAng1])),(4*#U#) | Fill Color #AccentSoft# | StrokeWidth 0
Shape3=Ellipse (130*#U#+112*#U#*sin([MeasureAng0])),(130*#U#-112*#U#*cos([MeasureAng0])),(5.5*#U#) | Fill Color #Accent# | StrokeWidth 0

[MeterHour]
Meter=String
MeasureName=MeasureHour
StringAlign=CenterCenter
FontFace=#Dot#
FontSize=(63*#U#)
FontColor=#Fg#
X=(130*#U#)
Y=(96*#U#)
AntiAlias=1
Text=%1

[MeterMin]
Meter=String
MeasureName=MeasureMin
StringAlign=CenterCenter
FontFace=#Dot#
FontSize=(63*#U#)
FontColor=#Accent#
X=(130*#U#)
Y=(165*#U#)
AntiAlias=1
Text=%1
