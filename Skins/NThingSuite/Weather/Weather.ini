[Rainmeter]
Update=66
DynamicWindowSize=1
AccurateText=1
ContextTitle=Size 75%
ContextAction=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle2=Size 100%
ContextAction2=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle3=Size 125%
ContextAction3=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle4=Size 150%
ContextAction4=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle5=Size 200%
ContextAction5=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Weather
Author=NThing Widgets
Information=Current temperature and conditions from wttr.in. Change Location in @Resources\Variables.inc.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

; refreshed every 15 minutes (18000 cycles x 50 ms)
[MeasureWeather]
Measure=WebParser
URL=https://wttr.in/#Location#?format=%25t|%25C
RegExp=(?s)^\+?(-?\d+)[^|]*\|\s*(.*?)\s*$
UpdateRate=13500

[MeasureTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureCond]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureFrame]
Measure=Calc
Formula=([MeasureFrame]+1)%90
DynamicVariables=1

[MeasureRot]
Measure=Calc
Formula=[MeasureFrame]*0.0087266
DynamicVariables=1

[Tile]
Meter=Shape
Shape=Rectangle 0,0,(260*#U#),(260*#U#),(52*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#

[Sun]
Meter=Shape
DynamicVariables=1
Shape=Ellipse (216*#U#),(44*#U#),(6*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape2=Ellipse (216*#U#+14*#U#*cos([MeasureRot])),(44*#U#+14*#U#*sin([MeasureRot])),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0
Shape3=Ellipse (216*#U#+14*#U#*cos([MeasureRot]+0.7854)),(44*#U#+14*#U#*sin([MeasureRot]+0.7854)),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0
Shape4=Ellipse (216*#U#+14*#U#*cos([MeasureRot]+1.5708)),(44*#U#+14*#U#*sin([MeasureRot]+1.5708)),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0
Shape5=Ellipse (216*#U#+14*#U#*cos([MeasureRot]+2.3562)),(44*#U#+14*#U#*sin([MeasureRot]+2.3562)),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0
Shape6=Ellipse (216*#U#+14*#U#*cos([MeasureRot]+3.1416)),(44*#U#+14*#U#*sin([MeasureRot]+3.1416)),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0
Shape7=Ellipse (216*#U#+14*#U#*cos([MeasureRot]+3.927)),(44*#U#+14*#U#*sin([MeasureRot]+3.927)),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0
Shape8=Ellipse (216*#U#+14*#U#*cos([MeasureRot]+4.7124)),(44*#U#+14*#U#*sin([MeasureRot]+4.7124)),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0
Shape9=Ellipse (216*#U#+14*#U#*cos([MeasureRot]+5.4978)),(44*#U#+14*#U#*sin([MeasureRot]+5.4978)),(2*#U#) | Fill Color 106,106,106,255 | StrokeWidth 0

[MeterLabel]
Meter=String
FontFace=#Mono#
FontSize=(10*#U#)
FontColor=#Muted#
StringCase=Upper
X=(26*#U#)
Y=(34*#U#)
Text=NOW - #Location#

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
StringAlign=LeftCenter
FontFace=#Dot#
FontSize=(78*#U#)
FontColor=#Fg#
X=(26*#U#)
Y=(150*#U#)
AntiAlias=1
Text=%1

; degree ring, placed right after the temperature digits
[MeterDegree]
Meter=Shape
DynamicVariables=1
Shape=Ellipse ([MeterTemp:X]+[MeterTemp:W]+12*#U#),(118*#U#),(6*#U#) | Fill Color 0,0,0,0 | StrokeWidth (4.5*#U#) | Stroke Color #Accent#

[MeterCond]
Meter=String
MeasureName=MeasureCond
FontFace=#Mono#
FontSize=(10.5*#U#)
FontColor=230,230,230,255
StringCase=Upper
W=(208*#U#)
ClipString=1
AntiAlias=1
X=(26*#U#)
Y=(216*#U#)
Text=%1
