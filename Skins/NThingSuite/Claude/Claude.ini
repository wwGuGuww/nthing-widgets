[Rainmeter]
Update=66
DynamicWindowSize=1
AccurateText=1
MouseActionCursor=1
ContextTitle=Size 75%
ContextAction=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle2=Size 100%
ContextAction2=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle3=Size 125%
ContextAction3=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle4=Size 150%
ContextAction4=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle5=Size 200%
ContextAction5=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Claude
Author=NThing Widgets
Information=Opens claude.ai. A dotted star slowly rotates.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

; 45 degrees (0.7854 rad) per 90 frames = a seamless loop (the star is 8-fold symmetric)
[MeasureFrame]
Measure=Calc
Formula=([MeasureFrame]+1)%90
DynamicVariables=1

[MeasureRot]
Measure=Calc
Formula=[MeasureFrame]*0.0087266
DynamicVariables=1

[Tile]
Meter=Shape
Shape=Rectangle 0,0,(260*#U#),(260*#U#),(52*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#
LeftMouseUpAction=["https://claude.ai"]

[Star]
Meter=Shape
DynamicVariables=1
Shape=Ellipse (130*#U#),(110*#U#),(7*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape2=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+0)),(110*#U#+18*#U#*sin([MeasureRot]+0)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape3=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+0.7854)),(110*#U#+18*#U#*sin([MeasureRot]+0.7854)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape4=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+1.5708)),(110*#U#+18*#U#*sin([MeasureRot]+1.5708)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape5=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+2.3562)),(110*#U#+18*#U#*sin([MeasureRot]+2.3562)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape6=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+3.1416)),(110*#U#+18*#U#*sin([MeasureRot]+3.1416)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape7=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+3.927)),(110*#U#+18*#U#*sin([MeasureRot]+3.927)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape8=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+4.7124)),(110*#U#+18*#U#*sin([MeasureRot]+4.7124)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape9=Ellipse (130*#U#+18*#U#*cos([MeasureRot]+5.4978)),(110*#U#+18*#U#*sin([MeasureRot]+5.4978)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape10=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+0)),(110*#U#+36*#U#*sin([MeasureRot]+0)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape11=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+0.7854)),(110*#U#+36*#U#*sin([MeasureRot]+0.7854)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape12=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+1.5708)),(110*#U#+36*#U#*sin([MeasureRot]+1.5708)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape13=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+2.3562)),(110*#U#+36*#U#*sin([MeasureRot]+2.3562)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape14=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+3.1416)),(110*#U#+36*#U#*sin([MeasureRot]+3.1416)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape15=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+3.927)),(110*#U#+36*#U#*sin([MeasureRot]+3.927)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape16=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+4.7124)),(110*#U#+36*#U#*sin([MeasureRot]+4.7124)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
Shape17=Ellipse (130*#U#+36*#U#*cos([MeasureRot]+5.4978)),(110*#U#+36*#U#*sin([MeasureRot]+5.4978)),(5*#U#) | Fill Color #Accent# | StrokeWidth 0
LeftMouseUpAction=["https://claude.ai"]

[Arrow]
Meter=Shape
Shape=Path ArrowPath | Fill Color 0,0,0,0 | StrokeWidth (2.5*#U#) | Stroke Color #Muted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
ArrowPath=(206*#U#),(36*#U#) | LineTo (222*#U#),(36*#U#) | LineTo (222*#U#),(52*#U#)
Shape2=Line (222*#U#),(36*#U#),(204*#U#),(54*#U#) | StrokeWidth (2.5*#U#) | Stroke Color #Muted# | StrokeStartCap Round | StrokeEndCap Round

[MeterName]
Meter=String
FontFace=#Dot#
FontSize=(22.5*#U#)
FontColor=#Fg#
X=(28*#U#)
Y=(180*#U#)
AntiAlias=1
Text=CLAUDE
LeftMouseUpAction=["https://claude.ai"]

[MeterHint]
Meter=String
FontFace=#Mono#
FontSize=(9.5*#U#)
FontColor=#Muted#
X=(28*#U#)
Y=(228*#U#)
Text=OPEN / CLAUDE.AI
