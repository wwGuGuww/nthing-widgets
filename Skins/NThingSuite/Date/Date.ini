[Rainmeter]
Update=66
DynamicWindowSize=1
AccurateText=1
ContextTitle=Size 75%
ContextAction=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle2=Size 100%
ContextAction2=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle3=Size 125%
ContextAction3=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle4=Size 150%
ContextAction4=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle5=Size 200%
ContextAction5=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Date
Author=NThing Widgets
Information=Date pill with a week strip. Today is marked in red and pulses.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

[MeasureDay]
Measure=Time
Format=%#d

[MeasureMonth]
Measure=Time
Format=%B

[MeasureWeekday]
Measure=Time
Format=%A

; 0 = Sunday ... 6 = Saturday
[MeasureW]
Measure=Time
Format=%w

; column of today in a Monday-first week strip
[MeasureCol]
Measure=Calc
Formula=([MeasureW]+6)%7

[MeasureTodayLabel]
Measure=Time
Format=%w
Substitute="0":"SU","1":"MO","2":"TU","3":"WE","4":"TH","5":"FR","6":"SA"

; 3 s pulse (45 frames at 66 ms)
[MeasureTick]
Measure=Calc
Formula=([MeasureTick]+1)%45

[MeasurePulse]
Measure=Calc
Formula=1+0.035*(1+sin([MeasureTick]*0.13963-1.5708))
DynamicVariables=1

[Pill]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0,0,(544*#U#),(112*#U#),(56*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#
Shape2=Ellipse (56*#U#),(56*#U#),(40*#U#*[MeasurePulse]) | Fill Color #Accent# | StrokeWidth 0
; week strip dots
Shape3=Ellipse (334*#U#),(68*#U#),(3*#U#) | Fill Color #Dim# | StrokeWidth 0
Shape4=Ellipse (362*#U#),(68*#U#),(3*#U#) | Fill Color #Dim# | StrokeWidth 0
Shape5=Ellipse (390*#U#),(68*#U#),(3*#U#) | Fill Color #Dim# | StrokeWidth 0
Shape6=Ellipse (418*#U#),(68*#U#),(3*#U#) | Fill Color #Dim# | StrokeWidth 0
Shape7=Ellipse (446*#U#),(68*#U#),(3*#U#) | Fill Color #Dim# | StrokeWidth 0
Shape8=Ellipse (474*#U#),(68*#U#),(3*#U#) | Fill Color #Dim# | StrokeWidth 0
Shape9=Ellipse (502*#U#),(68*#U#),(3*#U#) | Fill Color #Dim# | StrokeWidth 0
Shape10=Ellipse (334*#U#+28*#U#*[MeasureCol]),(68*#U#),(3.6*#U#*[MeasurePulse]) | Fill Color #Accent# | StrokeWidth 0

[MeterDay]
Meter=String
MeasureName=MeasureDay
StringAlign=CenterCenter
FontFace=#Dot#
FontSize=(34.5*#U#)
FontColor=#Fg#
X=(56*#U#)
Y=(58*#U#)
AntiAlias=1
Text=%1

[MeterMonth]
Meter=String
MeasureName=MeasureMonth
StringAlign=LeftCenter
FontFace=#Dot#
FontSize=(30*#U#)
FontColor=#Fg#
StringCase=Upper
X=(118*#U#)
Y=(46*#U#)
AntiAlias=1
Text=%1

[MeterWeekday]
Meter=String
MeasureName=MeasureWeekday
StringAlign=LeftCenter
FontFace=#Mono#
FontSize=(9*#U#)
FontColor=255,77,77,255
StringCase=Upper
X=(118*#U#)
Y=(80*#U#)
Text=%1

[MeterWeekLabels]
Meter=String
StringAlign=Center
FontFace=#Mono#
FontSize=(6.75*#U#)
FontColor=140,140,140,255
X=(334*#U#)
Y=(36*#U#)
Text=MO
; each label is positioned with its own meter below

[L2]
Meter=String
MeterStyle=Lbl
X=(362*#U#)
Text=TU
[L3]
Meter=String
MeterStyle=Lbl
X=(390*#U#)
Text=WE
[L4]
Meter=String
MeterStyle=Lbl
X=(418*#U#)
Text=TH
[L5]
Meter=String
MeterStyle=Lbl
X=(446*#U#)
Text=FR
[L6]
Meter=String
MeterStyle=Lbl
X=(474*#U#)
Text=SA
[L7]
Meter=String
MeterStyle=Lbl
X=(502*#U#)
Text=SU

[Lbl]
StringAlign=Center
FontFace=#Mono#
FontSize=(6.75*#U#)
FontColor=140,140,140,255
Y=(36*#U#)

; today's label drawn in white over the grey one
[MeterToday]
Meter=String
MeasureName=MeasureTodayLabel
DynamicVariables=1
StringAlign=Center
FontFace=#Mono#
FontWeight=700
FontSize=(6.75*#U#)
FontColor=#Fg#
X=(334*#U#+28*#U#*[MeasureCol])
Y=(36*#U#)
Text=%1
