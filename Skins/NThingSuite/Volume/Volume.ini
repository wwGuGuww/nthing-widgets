[Rainmeter]
Update=40
DynamicWindowSize=1
AccurateText=1
MouseActionCursor=1
ContextTitle=Size 75%
ContextAction=[!WriteKeyValue Variables Scale 0.75][!Refresh]
ContextTitle2=Size 100%
ContextAction2=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle3=Size 125%
ContextAction3=[!WriteKeyValue Variables Scale 1.25][!Refresh]
ContextTitle4=Size 150%
ContextAction4=[!WriteKeyValue Variables Scale 1.5][!Refresh]
ContextTitle5=Size 200%
ContextAction5=[!WriteKeyValue Variables Scale 2][!Refresh]

[Metadata]
Name=NThing Volume
Author=NThing Widgets
Information=Dotted volume dial. Click + / - to change the volume by 2%, click the dial to mute.

[Variables]
Scale=1
@include=#@#Variables.inc
U=(0.6154*#Scale#)

; Real system volume (Win7AudioPlugin ships with Rainmeter)
[MeasureVol]
Measure=Plugin
Plugin=Win7AudioPlugin

; displayed value eases towards the real value
[MeasureDisp]
Measure=Calc
Formula=[MeasureDisp]+([MeasureVol]-[MeasureDisp])*0.22
DynamicVariables=1

; end angle of the red arc: starts at 135 deg, sweeps 2.7 deg per percent
[MeasureRad]
Measure=Calc
Formula=(135+(([MeasureDisp]<0.5) ? 0.5 : [MeasureDisp])*2.7)*0.0174533
DynamicVariables=1

[MeasureLarge]
Measure=Calc
Formula=([MeasureDisp]*2.7>180) ? 1 : 0
DynamicVariables=1

[Face]
Meter=Shape
Shape=Ellipse (130*#U#),(130*#U#),(129*#U#) | Fill Color #Tile# | StrokeWidth 1 | Stroke Color #TileEdge#
Shape2=Arc (130*#U#-76.37*#U#),(130*#U#+76.37*#U#),(130*#U#+76.37*#U#),(130*#U#+76.37*#U#),(108*#U#),(108*#U#),0,1,1 | Fill Color 0,0,0,0 | StrokeWidth (6*#U#) | Stroke Color #Dim# | StrokeDashes 0,2.827 | StrokeDashCap Round

[Fill]
Meter=Shape
DynamicVariables=1
Shape=Arc (130*#U#-76.37*#U#),(130*#U#+76.37*#U#),(130*#U#+108*#U#*cos([MeasureRad])),(130*#U#+108*#U#*sin([MeasureRad])),(108*#U#),(108*#U#),0,1,[MeasureLarge] | Fill Color 0,0,0,0 | StrokeWidth (9*#U#) | Stroke Color #Accent# | StrokeDashes 0,1.884 | StrokeDashCap Round

[Knob]
Meter=Shape
DynamicVariables=1
Shape=Ellipse (130*#U#),(130*#U#),(62*#U#) | Fill Color #Key# | StrokeWidth 1.5 | Stroke Color #KeyEdge#
Shape2=Ellipse (130*#U#+58*#U#*cos([MeasureRad])),(130*#U#+58*#U#*sin([MeasureRad])),(5.5*#U#) | Fill Color #Accent# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureVol "ToggleMute"]

[MeterNum]
Meter=String
MeasureName=MeasureDisp
StringAlign=CenterCenter
FontFace=#Dot#
FontSize=(39*#U#)
FontColor=#Fg#
NumOfDecimals=0
X=(130*#U#)
Y=(118*#U#)
AntiAlias=1
Text=%1

[MeterLabel]
Meter=String
StringAlign=CenterCenter
FontFace=#Mono#
FontSize=(7.5*#U#)
FontColor=#Muted#
X=(130*#U#)
Y=(152*#U#)
Text=VOLUME

[BtnDown]
Meter=Shape
Shape=Rectangle (52*#U#),(206*#U#),(40*#U#),(40*#U#),(8*#U#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line (68*#U#),(226*#U#),(80*#U#),(226*#U#) | StrokeWidth (3*#U#) | Stroke Color #Muted# | StrokeStartCap Round | StrokeEndCap Round
LeftMouseUpAction=[!CommandMeasure MeasureVol "ChangeVolume -2"]

[BtnUp]
Meter=Shape
Shape=Rectangle (168*#U#),(206*#U#),(40*#U#),(40*#U#),(8*#U#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line (180*#U#),(226*#U#),(192*#U#),(226*#U#) | StrokeWidth (3*#U#) | Stroke Color #Muted# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line (186*#U#),(220*#U#),(186*#U#),(232*#U#) | StrokeWidth (3*#U#) | Stroke Color #Muted# | StrokeStartCap Round | StrokeEndCap Round
LeftMouseUpAction=[!CommandMeasure MeasureVol "ChangeVolume +2"]
